services:
  # Database
  db:
    image: mariadb:11
    volumes:
      - database:/var/lib/mysql
      # Error + slow query logs, exposed in ./logs/mysql
      - ./config/mysql/logging.cnf:/etc/mysql/conf.d/logging.cnf:ro
      - ./logs/mysql:/var/log/mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change-me}
      MYSQL_DATABASE: ${DB_NAME:-wordpress}
      MYSQL_USER: ${DB_USER:-wordpress}
      MYSQL_PASSWORD: ${DB_PASS:-wordpress}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # phpMyAdmin
  phpmyadmin:
    depends_on:
      db:
        condition: service_healthy
    image: phpmyadmin:latest
    ports:
      - '${PHPMYADMIN_PORT:-8080}:80'
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change-me}
      UPLOAD_LIMIT: 64M

  # WordPress
  wordpress:
    depends_on:
      db:
        condition: service_healthy
    image: wordpress:latest
    ports:
      - '${WP_PORT:-8000}:80'
    restart: unless-stopped
    volumes:
      - ./config/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
      - ./config/wordpress/wp-config.php:/var/www/html/wp-config.php
      - ./config/wordpress/.htaccess:/var/www/html/.htaccess
      - ./themes:/var/www/html/wp-content/themes
      - wordpress_data:/var/www/html
      # Logs exposed in ./logs: apache/ (access+error), wp-debug.log, php-error.log
      - ./logs/apache:/var/log/apache2
      - ./logs:/var/log/app
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${DB_PASS:-wordpress}
      # Set WP_DEBUG=0 in .env to turn off debug logging
      WORDPRESS_DEBUG: ${WP_DEBUG:-1}

  # WP-CLI — keep alive for ad-hoc commands: docker compose exec wp-cli wp <command>
  wp-cli:
    image: wordpress:cli
    depends_on:
      - db
      - wordpress
    volumes:
      - wordpress_data:/var/www/html
      - ./config/wordpress/wp-config.php:/var/www/html/wp-config.php
      - ./themes:/var/www/html/wp-content/themes
      # Same log path as the wordpress service, so wp-cli's errors land in ./logs too
      - ./logs:/var/log/app
      # Repo root, read-only - lets `wp eval-file` run one-off content/seed
      # scripts kept in bin/wp/ without them having to live inside the theme.
      - .:/workspace:ro
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${DB_PASS:-wordpress}
      WORDPRESS_DEBUG: ${WP_DEBUG:-1}
    entrypoint: ["sleep", "9999"]

volumes:
  database: {}
  wordpress_data: {}
